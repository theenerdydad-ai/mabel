[project]
name = "mabel"
version = "0.1.0"
description = "MABEL operational runtime foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0,<47.0",
    "fastapi>=0.115,<1.0",
    "fastmcp>=3.3,<4.0",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.23,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mabel"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
